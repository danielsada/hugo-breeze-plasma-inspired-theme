# Builds exampleSite/ with this theme and publishes it to GitHub Pages.
name: Demo site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.170.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Hugo
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
          hugo version

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build the example site
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo --source exampleSite --minify --gc --panicOnWarning \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      # The demo is served from a sub-path (/<repo>/): every root-relative link must carry it.
      - name: Check links keep the base path
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ -n "${BASE_PATH}" ]; then
            bad=$(grep -rhoE '(href|src)="/[^"]*"' exampleSite/public --include='*.html' \
                  | grep -vE "=\"${BASE_PATH}/" | sort -u || true)
            if [ -n "$bad" ]; then echo "Links missing ${BASE_PATH}:"; echo "$bad"; exit 1; fi
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: exampleSite/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
